name: CI and packages

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gir1.2-gtk-3.0 python3-cairo python3-gi python3-gi-cairo \
            xauth xvfb

      - name: Run unit tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -v

  debian:
    name: Build Debian package
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential debhelper devscripts dh-python gettext intltool \
            python3-all python3-setuptools

      - name: Set Debian package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $TAG_NAME" >&2
            exit 1
          fi
          dch --newversion "${version}-0" --distribution unstable \
            "Build release ${version} from tag ${TAG_NAME}."

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Collect Debian package
        run: |
          mkdir -p artifacts
          cp ../pymbook_*.deb artifacts/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: artifacts/*.deb
          if-no-files-found: error

  rpm:
    name: Build RPM package
    runs-on: ubuntu-24.04
    needs: tests
    container: fedora:44
    steps:
      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            desktop-file-utils gettext git intltool python3-devel \
            python3-gobject python3-cairo python3-setuptools rpm-build

      - uses: actions/checkout@v4

      - name: Prepare RPM source archive
        shell: bash
        run: |
          version="$(awk '/^Version:/ { print $2; exit }' pymbook.spec)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            sed -i -E "s/^Version:[[:space:]]+.*/Version:        ${version}/" pymbook.spec
          fi

          topdir="$HOME/rpmbuild"
          mkdir -p "$topdir"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          git -c safe.directory="$GITHUB_WORKSPACE" archive \
            --format=tar --prefix="pymbook-${version}/" "$GITHUB_SHA" \
            | gzip -n > "$topdir/SOURCES/pymbook-${version}.tar.gz"

      - name: Build RPM
        shell: bash
        run: |
          topdir="$HOME/rpmbuild"
          rpmbuild -ba --define "_topdir $topdir" pymbook.spec
          mkdir -p artifacts
          cp "$topdir"/RPMS/noarch/*.rpm "$topdir"/SRPMS/*.rpm artifacts/

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: artifacts/*.rpm
          if-no-files-found: error

  release:
    name: Create Release with Packages
    runs-on: ubuntu-24.04
    needs: [tests, debian, rpm]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp all-artifacts/debian-package/*.deb release-assets/
          cp all-artifacts/rpm-package/*.rpm release-assets/
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
